%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/loongson/loongson,ls3c6000se.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#
title: Loongson Security Module (SE)
maintainers:
  - Qunqin Zhao <zhaoqunqin@loongson.cn>
description:
  This binding describes the Loongson Security Module which provides control for
  hardware encryption acceleration devices.
properties:
  compatible:
    items:
      - enum:
          - "loongson,ls3xse"
  reg:
    maxItems: 1
  interrupts:
    minItems: 1
    maxItems: 32
  dmam_size:
    $ref: /schemas/types.yaml#/definitions/uint32
required:
  - compatible
  - reg
  - interrupts
  - dmam_size
additionalProperties: false
examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>
    soc {
      #address-cells = <2>;
      #size-cells = <2>;
      lsse@c00e0000000 {
        compatible = "loongson,ls3c6000se";
        reg = <0xc00 0xe0000000 0x0 0x1000>;
        interrupt-parent = <&liointc>;
        interrupts = <0x20 IRQ_TYPE_LEVEL_HIGH>;
        dmam_size = <0x800000>;
      };
    };
